# Grafana values for ephemeral benchmark instance.
# Deployed via helm upgrade on the existing kube-prometheus-stack release.
# Anonymous access enabled — no login required for snapshot API.
grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin
  service:
    type: ClusterIP
    port: 3000
  # Allow anonymous access so the benchmark can use the API without auth tokens
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin
    security:
      allow_embedding: true
    snapshots:
      external_enabled: false
  # Auto-provision Prometheus as a datasource
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: https://kube-prometheus-stack-prometheus.workload-variant-autoscaler-monitoring.svc.cluster.local:9090
      isDefault: true
      jsonData:
        tlsSkipVerify: true
  # Auto-provision the benchmark dashboard from a ConfigMap sidecar
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "benchmark"
      folder: /tmp/dashboards
      searchNamespace: ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
